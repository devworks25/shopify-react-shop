name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Create production environment file
        run: |
          echo "VITE_SHOPIFY_STORE_DOMAIN=${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}" >> .env.production
          echo "VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN=${{ secrets.VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}" >> .env.production
          echo "VITE_SHOPIFY_API_VERSION=${{ secrets.VITE_SHOPIFY_API_VERSION }}" >> .env.production
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_FLOWER_07A1E0800 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          app_location: "/"
          output_location: "dist"
          build_timeout_in_minutes: 30

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_FLOWER_07A1E0800 }}
          action: close
